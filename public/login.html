<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · OLAF Builders</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/js/login.js"></script>
</head>
<body>
  <div class="sec-band" id="band">LGE Internal Use Only</div>
  <main class="narrow">
    <h1 id="title">OLAF Builders</h1>
    <p class="muted" id="msg-brand"></p>
    <form id="f" class="card">
      <label for="username">아이디</label>
      <input type="text" id="username" name="username" maxlength="32" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" maxlength="128" autocomplete="current-password" required>
      <div id="out"></div>
      <div class="row end" style="margin-top:14px"><button class="primary" type="submit" id="go">로그인</button></div>
    </form>
    <p class="small muted">아이디 또는 비밀번호를 잊었다면 사무국에 재설정을 요청하세요.</p>
  </main>
</body>
</html>
